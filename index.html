<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canvaz</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- Global Navigation -->
<nav class="global-nav" aria-label="Global navigation">
  <div class="global-logo">M</div>

  <div class="global-icon" title="Account">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
      <circle cx="12" cy="8" r="4"></circle>
      <path d="M4 21a8 8 0 0 1 16 0"></path>
    </svg>
  </div>

  <div class="global-icon" title="Dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
      <path d="M4 13a8 8 0 0 1 16 0"></path>
      <path d="M12 13l4-4"></path>
      <path d="M4 13h3"></path>
      <path d="M17 13h3"></path>
    </svg>
  </div>

  <div class="global-icon active" title="Courses">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
      <path d="M5 4h14v16H5z"></path>
      <path d="M8 8h8"></path>
      <path d="M8 12h6"></path>
    </svg>
  </div>

  <div class="global-icon" title="Calendar">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
      <rect x="4" y="5" width="16" height="16" rx="1"></rect>
      <path d="M8 3v4"></path>
      <path d="M16 3v4"></path>
      <path d="M4 10h16"></path>
    </svg>
  </div>

  <div class="global-icon" title="Inbox">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
      <path d="M4 6h16v12H4z"></path>
      <path d="M4 8l8 6 8-6"></path>
    </svg>
    <span class="global-badge">16</span>
  </div>

  <div class="global-icon" title="History">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M12 7v6l4 2"></path>
    </svg>
  </div>

  <div class="global-icon" title="Search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
      <circle cx="10" cy="10" r="6"></circle>
      <path d="M15 15l5 5"></path>
    </svg>
  </div>

  <div class="global-icon" title="Help">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M9.5 9a2.5 2.5 0 1 1 4.1 1.9c-.9.6-1.6 1.2-1.6 2.6"></path>
      <path d="M12 17h.01"></path>
    </svg>
  </div>
</nav>

<!-- Top Bar -->
<div class="top-bar">
  <div class="top-bar-left"></div>

  <div class="top-bar-actions">
    <button class="btn-return" onclick="location.reload()">Return</button>
    <button class="btn-submit" id="submit-btn" hidden>Submit</button>
  </div>
</div>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-tool" title="Quiz">
    <svg class="rocket-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round"
      d="M15.59 14.37a6 6 0 01-5.84 7.38v-4.82m5.84-2.56a14.98 14.98 0 006.16-12.12A14.98 14.98 0 009.63 3.61a14.98 14.98 0 00-2.56 6.16"/>
      <path stroke-linecap="round" stroke-linejoin="round" d="M7.07 9.77L3 13.84l4.82.7"></path>
      <path stroke-linecap="round" stroke-linejoin="round" d="M14.23 16.93L10.16 21l-.7-4.82"></path>
    </svg>
  </div>

  <div class="sidebar-tool" title="Collapse">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
      <path d="M4 12h13"></path>
      <path d="M13 8l4 4-4 4"></path>
    </svg>
  </div>

  <div class="sidebar-tool active" title="Pinned">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
      <path d="M14 4l6 6"></path>
      <path d="M12 6l6 6-4 1-5 5-3-3 5-5z"></path>
    </svg>
  </div>

  <div class="sidebar-tool" title="Details">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
      <path d="M6 4h12v16H6z"></path>
      <path d="M9 8h6"></path>
    </svg>
  </div>

  <div id="sidebar-questions"></div>
</div>

<!-- Main -->
<div class="main">
  <div class="quiz-card">

    <h1 class="quiz-title" id="quiz-title"></h1>
    <p class="quiz-description" id="quiz-description"></p>

    <div id="landing-container"></div>

    <div id="questions-container"></div>

    <div id="score-container"></div>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
