<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz App</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Lato", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 16px;
    color: #2d3b45;
    background: #f5f5f5;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 52px;
    background: #fff;
    border-bottom: 1px solid #c7cdd1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    z-index: 100;
  }

  .top-bar-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .rocket-icon {
    width: 32px;
    height: 32px;
    color: #6b2c91;
  }

  .top-bar-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .btn-return {
    padding: 8px 18px;
    border: 1px solid #c7cdd1;
    border-radius: 4px;
    background: #fff;
    color: #2d3b45;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
  }

  .btn-submit {
    padding: 8px 18px;
    border: none;
    border-radius: 4px;
    background: #0770a3;
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }

  .sidebar {
    position: fixed;
    top: 52px;
    left: 0;
    bottom: 0;
    width: 52px;
    background: #fff;
    border-right: 1px solid #c7cdd1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 8px;
    overflow-y: auto;
  }

  .sidebar-divider {
    width: 32px;
    border: none;
    border-top: 1px solid #c7cdd1;
    margin: 6px 0;
  }

  .sidebar-num {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: #2d3b45;
    cursor: pointer;
    border-radius: 4px;
    margin-bottom: 2px;
  }

  .sidebar-num:hover {
    background: #e8f4fb;
    color: #0770a3;
  }

  .main {
    margin-top: 52px;
    margin-left: 52px;
    padding: 32px 24px;
    flex: 1;
  }

  .quiz-card {
    background: #fff;
    border-radius: 4px;
    padding: 32px 40px;
    max-width: 1000px;
    margin: 0 auto;
    border: 1px solid #e1e7ea;
  }

  .quiz-title {
    font-size: 26px;
    font-weight: bold;
    margin-bottom: 24px;
  }

  .quiz-description {
    font-size: 15px;
    margin-bottom: 32px;
    border-bottom: 1px solid #e1e7ea;
    padding-bottom: 24px;
  }

  .question {
    margin-bottom: 36px;
  }

  .question-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .question-meta {
    display: flex;
  }

  .question-num {
    background: #2d3b45;
    color: #fff;
    font-size: 15px;
    font-weight: bold;
    width: 40px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 3px 0 0 3px;
  }

  .question-type-pts {
    background: #f5f5f5;
    border: 1px solid #c7cdd1;
    border-left: none;
    font-size: 13px;
    color: #6b7780;
    padding: 0 12px;
    height: 36px;
    display: flex;
    align-items: center;
    border-radius: 0 3px 3px 0;
  }

  .question-text {
    font-size: 15px;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .options {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }

  .option input[type="radio"] {
    width: 18px;
    height: 18px;
    accent-color: #0770a3;
  }

  .question-separator {
    border: none;
    border-top: 1px solid #e1e7ea;
    margin: 0 0 36px 0;
  }

  .correct {
    color: green;
    font-weight: bold;
  }

  .incorrect {
    color: red;
    font-weight: bold;
  }

  .score-box {
    margin-top: 30px;
    padding: 20px;
    background: #f5f5f5;
    border-radius: 6px;
    font-size: 18px;
    font-weight: bold;
  }
</style>
</head>

<body>

<!-- Top Bar -->
<div class="top-bar">
  <div class="top-bar-left">
    <svg class="rocket-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round"
      d="M15.59 14.37a6 6 0 01-5.84 7.38v-4.82m5.84-2.56a14.98 14.98 0 006.16-12.12A14.98 14.98 0 009.63 3.61a14.98 14.98 0 00-2.56 6.16"/>
    </svg>
  </div>

  <div class="top-bar-actions">
    <button class="btn-return" onclick="location.reload()">Return</button>
    <button class="btn-submit" id="submit-btn">Submit</button>
  </div>
</div>

<!-- Sidebar -->
<div class="sidebar">
  <hr class="sidebar-divider">
  <div id="sidebar-questions"></div>
</div>

<!-- Main -->
<div class="main">
  <div class="quiz-card">

    <h1 class="quiz-title" id="quiz-title"></h1>
    <p class="quiz-description" id="quiz-description"></p>

    <div id="questions-container"></div>

    <div id="score-container"></div>

  </div>
</div>

<script src="questions.js"></script>
<script src="script.js"></script>

</body>
</html>
